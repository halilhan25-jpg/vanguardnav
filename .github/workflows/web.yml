name: VanguardNav saha kontrolleri
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'sw.js','tests/field.cjs','.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fotoğraf, yedek, geri yükleme ve çevrimdışı açılış
        run: |
          npm install --no-save playwright@1.56.1
          python3 -m http.server 8080 --bind 127.0.0.1 &
          node tests/field.cjs
