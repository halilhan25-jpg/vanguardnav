<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VanguardNav</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --glass-bg: rgba(18, 22, 28, 0.76);
      --glass-card: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.45);
      --ok-color: #22c55e;
      --warn-color: #f59e0b;
      --grid-line: rgba(255, 255, 255, 0.14);
      --map-bg: #0b0f14;
    }

    [data-theme="daylight"] {
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-card: rgba(0, 0, 0, 0.06);
      --glass-border: rgba(0, 0, 0, 0.18);
      --text-main: #090d16;
      --text-muted: #475569;
      --accent-blue: #1d4ed8;
      --accent-glow: rgba(29, 78, 216, 0.3);
      --ok-color: #15803d;
      --warn-color: #b45309;
      --grid-line: rgba(0, 0, 0, 0.16);
      --map-bg: #e5e7eb;
    }

    [data-theme="red"] {
      --glass-bg: rgba(12, 0, 0, 0.88);
      --glass-card: rgba(239, 68, 68, 0.1);
      --glass-border: rgba(239, 68, 68, 0.4);
      --text-main: #ef4444;
      --text-muted: #b91c1c;
      --accent-blue: #dc2626;
      --accent-glow: rgba(220, 38, 38, 0.4);
      --ok-color: #ef4444;
      --warn-color: #991b1b;
      --grid-line: rgba(239, 68, 68, 0.22);
      --map-bg: #050000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--map-bg);
      color: var(--text-main);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* TAM EKRAN HARİTA */
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--map-bg);
      z-index: 1;
    }

    [data-theme="red"] .leaflet-tile-pane {
      filter: invert(100%) sepia(100%) saturate(650%) hue-rotate(320deg) brightness(60%) contrast(135%);
    }

    .offline-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 2;
      display: none;
    }
    .offline-grid.visible { display: block; }

    /* CAM (LIQUID GLASS) ORTAK SINIFI */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
    }

    /* 1. ÜST PUSULA VE GPS KAPSÜLÜ */
    .top-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: 42px;
      border-radius: 21px;
      display: flex;
      align-items: center;
      padding: 0 12px 0 8px;
      gap: 8px;
      z-index: 1000;
    }

    .compass-viewport {
      position: relative;
      flex: 1;
      height: 28px;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, black 18%, black 82%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 18%, black 82%, transparent);
    }

    .compass-center-pin {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ef4444;
      transform: translateX(-50%);
      z-index: 5;
    }
    .compass-center-pin::before {
      content: "";
      position: absolute;
      top: 0;
      left: -4px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 5px solid #ef4444;
    }

    .compass-strip {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: flex-end;
      padding-bottom: 3px;
      will-change: transform;
    }

    .c-tick {
      width: 10px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .c-tick-label {
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 2px;
      color: var(--text-main);
    }
    .c-tick-label.north { color: #ef4444; font-weight: 900; }

    .c-tick-line {
      width: 1px;
      height: 6px;
      background: var(--text-muted);
      opacity: 0.6;
    }
    .c-tick-line.major {
      height: 10px;
      width: 1.5px;
      background: var(--text-main);
      opacity: 0.9;
    }

    .hud-divider {
      width: 1px;
      height: 20px;
      background: var(--glass-border);
    }

    .heading-readout {
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 44px;
      text-align: center;
      cursor: pointer;
    }

    .gps-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .gps-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn-color);
      box-shadow: 0 0 8px var(--warn-color);
    }
    .gps-dot.locked {
      background: var(--ok-color);
      box-shadow: 0 0 8px var(--ok-color);
    }

    /* 2. ÜST ALT KAPSÜLLER (RAKIM & HARİTA MODLARI) */
    .sub-hud-row {
      position: absolute;
      top: 60px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 950;
    }

    .mini-pill {
      pointer-events: auto;
      height: 36px;
      border-radius: 18px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    /* HARİTA MODLARI AÇILIR KARTI */
    .map-modes-wrapper {
      position: relative;
      pointer-events: auto;
    }

    .modes-popover {
      position: absolute;
      top: 44px;
      right: 0;
      width: 224px;
      border-radius: 18px;
      padding: 10px;
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      z-index: 1100;
    }
    .modes-popover.open { display: grid; }

    .mode-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 6px;
      border-radius: 12px;
      background: var(--glass-card);
      border: 2px solid transparent;
      cursor: pointer;
    }
    .mode-card.active {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .mode-thumb {
      width: 100%;
      height: 46px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .thumb-sat {
      background: radial-gradient(circle at 30% 40%, #365314, #14532d 55%, #1c1917);
    }
    .thumb-topo {
      background: #27272a;
      background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 6px, rgba(255,255,255,0.22) 7px);
    }
    .thumb-terrain {
      background: linear-gradient(135deg, #4d7c0f 0%, #a16207 50%, #3f6212 100%);
    }
    .thumb-grid {
      background: #0f172a;
      background-image: linear-gradient(to right, rgba(56,189,248,0.3) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(56,189,248,0.3) 1px, transparent 1px);
      background-size: 12px 12px;
    }

    .mode-card span {
      font-size: 11px;
      font-weight: 700;
    }

    /* 3. ORTA SAĞ YUVARLAK İKON BUTONLARI */
    .right-fab-stack {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 900;
    }

    .circle-fab {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      cursor: pointer;
    }
    .circle-fab:active { transform: scale(0.94); }

    /* 4. iOS 26 LIQUID GLASS AYRIK ALT DOCK */
    .bottom-dock-container {
      position: absolute;
      bottom: 14px;
      left: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }

    .dock-pill {
      flex: 1;
      height: 62px;
      border-radius: 31px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
    }

    .dock-item {
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-main);
      opacity: 0.78;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .dock-item.active {
      opacity: 1;
      background: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .dock-item span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1px;
    }

    .dock-plus-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: var(--glass-bg);
      border: 1.5px solid var(--accent-blue);
      box-shadow: 0 0 20px var(--accent-glow), 0 8px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }
    .dock-plus-btn:active { transform: scale(0.93); }

    /* 5. GÖRÜNÜMLER ÇEKMECESİ (BOTTOM SHEET) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1200;
      display: none;
    }
    .drawer-backdrop.open { display: block; }

    .views-drawer {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 86px;
      border-radius: 24px;
      padding: 16px;
      z-index: 1300;
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .views-drawer.open { display: flex; }

    .drawer-section-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .theme-pills-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .pill-choice {
      padding: 9px 6px;
      border-radius: 14px;
      background: var(--glass-card);
      border: 1.5px solid transparent;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-choice.active {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .drawer-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .drawer-card-btn {
      padding: 11px 12px;
      border-radius: 14px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* TOGGLE ANAHTARI (EKRAN KİLİDİ) */
    .switch-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .switch-track {
      width: 38px;
      height: 22px;
      border-radius: 11px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      position: relative;
      transition: background 0.2s;
    }
    .switch-track.on {
      background: var(--accent-blue);
    }
    .switch-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }
    .switch-track.on .switch-thumb {
      transform: translateX(16px);
    }

    /* BİLDİRİM TOAST */
    .toast {
      position: fixed;
      top: 106px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      z-index: 2000;
      display: none;
      white-space: nowrap;
    }
  </style>
</head>
<body data-theme="oled">

  <!-- TAM EKRAN HARİTA -->
  <div id="map"></div>
  <div id="offlineGrid" class="offline-grid"></div>

  <!-- 1. ÜST PUSULA VE GPS KAPSÜLÜ -->
  <div class="top-hud glass">
    <div class="compass-viewport" id="compassViewport">
      <div class="compass-center-pin"></div>
      <div class="compass-strip" id="compassStrip"></div>
    </div>
    <div class="hud-divider"></div>
    <div class="heading-readout" id="headingVal" title="Koordinatı Kopyala">0°</div>
    <div class="hud-divider"></div>
    <div class="gps-pill" id="gpsStatusBtn">
      <span class="gps-dot" id="gpsDot"></span>
      <span id="gpsLabel">GPS</span>
    </div>
  </div>

  <!-- 2. ÜST ALT KAPSÜLLER (RAKIM & HARİTA MODLARI) -->
  <div class="sub-hud-row">
    <div class="mini-pill glass" id="altPill" title="Koordinatı Kopyala">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.81 13.75 7 10 7 10l-6 8h22L14 6z"/>
      </svg>
      <span id="altVal">-- m</span>
    </div>

    <div class="map-modes-wrapper">
      <div class="mini-pill glass" id="mapModesBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
        <span>Harita Modları</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>

      <!-- AÇILIR HARİTA MODLARI KARTI -->
      <div class="modes-popover glass" id="modesPopover">
        <div class="mode-card active" data-layer="sat">
          <div class="mode-thumb thumb-sat"></div>
          <span>Uydu</span>
        </div>
        <div class="mode-card" data-layer="topo">
          <div class="mode-thumb thumb-topo"></div>
          <span>Topoğrafik</span>
        </div>
        <div class="mode-card" data-layer="terrain">
          <div class="mode-thumb thumb-terrain"></div>
          <span>Arazi</span>
        </div>
        <div class="mode-card" data-layer="grid">
          <div class="mode-thumb thumb-grid"></div>
          <span>Izgara</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. ORTA SAĞ YUVARLAK İKON BUTONLARI -->
  <div class="right-fab-stack">
    <div class="circle-fab glass" id="quickThemeBtn" title="Görünüm Teması">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
    </div>
    <div class="circle-fab glass" id="centerMeBtn" title="Konumuma Odaklan">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="3"></circle>
        <circle cx="12" cy="12" r="8"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22" y2="12"></line>
      </svg>
    </div>
  </div>

  <!-- 4. iOS 26 LIQUID GLASS AYRIK ALT DOCK -->
  <div class="bottom-dock-container">
    <div class="dock-pill glass">
      <div class="dock-item active" id="navMap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
        <span>Harita</span>
      </div>
      <div class="dock-item" id="navDraw">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
          <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
        </svg>
        <span>Yol Çiz</span>
      </div>
      <div class="dock-item" id="navTrack">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
          <circle cx="6" cy="19" r="3"></circle>
          <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path>
          <circle cx="18" cy="5" r="3"></circle>
        </svg>
        <span>Rota Kaydı</span>
      </div>
      <div class="dock-item" id="navViews">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>Görünümler</span>
      </div>
    </div>

    <div class="dock-plus-btn" id="quickAddPinBtn" title="Hızlı Nokta Ekle">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </div>
  </div>

  <!-- 5. GÖRÜNÜMLER ÇEKMECESİ -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="views-drawer glass" id="viewsDrawer">
    <div>
      <div class="drawer-section-title">
        <span>EKRAN MODU</span>
        <div class="switch-wrap" id="wakeLockToggle">
          <span>Ekran Kilidi</span>
          <div class="switch-track" id="wakeSwitchTrack"><div class="switch-thumb"></div></div>
        </div>
      </div>
      <div class="theme-pills-row">
        <div class="pill-choice" data-set-theme="daylight">Güneş</div>
        <div class="pill-choice active" data-set-theme="oled">Gece</div>
        <div class="pill-choice" data-set-theme="red">Kırmızı Görüş</div>
      </div>
    </div>

    <div>
      <div class="drawer-section-title"><span>ŞAHSİ VERİLERİM</span></div>
      <div class="drawer-grid-2">
        <div class="drawer-card-btn" id="drawerRoutesBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="19" r="3"></circle>
            <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path>
            <circle cx="18" cy="5" r="3"></circle>
          </svg>
          <span>Yollarım (0)</span>
        </div>
        <div class="drawer-card-btn" id="drawerPinsBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>Noktalarım (0)</span>
        </div>
      </div>
    </div>

    <div>
      <div class="drawer-section-title"><span>VERİ & HARİTA</span></div>
      <div class="drawer-grid-2">
        <div class="drawer-card-btn" id="drawerBackupBtn">Tam Yedek Al</div>
        <div class="drawer-card-btn" id="drawerKmlBtn">Maps.me (.KML)</div>
      </div>
    </div>
  </div>

  <div class="toast glass" id="toast"></div>

  <script src="https://unpkg.com/
